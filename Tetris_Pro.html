<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tetris Game Fixed</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { margin: 5px 0; color: #00e676; font-size: 24px; }
        .stats-bar { display: flex; justify-content: space-between; width: 280px; background: #1e1e1e; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 11px; color: #aaa; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; color: #00e676; }
        #game-container { position: relative; border: 3px solid #00e676; border-radius: 6px; background-color: #000; width: 240px; height: 400px; }
        canvas { display: block; background-color: #050505; width: 100%; height: 100%; }
        .controls-panel { width: 280px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .btn-row { display: flex; gap: 5px; justify-content: center; }
        button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; font-size: 12px; }
        button:active { background: #00e676; color: #000; }
        .remote-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 5px; }
        .remote-btn { height: 45px; font-size: 16px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; }
        .remote-btn:active { background: #333; border-color: #00e676; }
        #overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 18px; font-weight: bold; cursor: pointer; z-index: 10; text-align: center; padding: 10px; }
    </style>
</head>
<body>

    <h1>TETRIS PRO</h1>

    <div class="stats-bar">
        <div class="stat-box"><div class="stat-label">Score</div><div id="score" class="stat-value">0</div></div>
        <div class="stat-box"><div class="stat-label">Level</div><div id="level" class="stat-value">1</div></div>
        <div class="stat-box"><div class="stat-label">Lines</div><div id="lines" class="stat-value">0</div></div>
    </div>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div id="overlay">Click / Tap to Start</div>
    </div>

    <div class="controls-panel">
        <div class="btn-row">
            <button id="btn-start">Start / Resume</button>
            <button id="btn-pause">Pause</button>
            <button id="btn-restart">Restart New</button>
        </div>
        <div class="btn-row">
            <button id="btn-mute">Mute: OFF</button>
            <button id="btn-vol-down">Vol -</button>
            <button id="btn-vol-up">Vol +</button>
        </div>
        <div class="remote-pad">
            <div></div><button class="remote-btn" id="rm-rotate">↻</button><div></div>
            <button class="remote-btn" id="rm-left">◄</button>
            <button class="remote-btn" id="rm-down">▼</button>
            <button class="remote-btn" id="rm-right">►</button>
            <button class="remote-btn" id="rm-drop" style="grid-column: span 3; background:#1b382b; color:#00e676;">HARD DROP</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);
        const overlay = document.getElementById('overlay');

        class SoundEngine {
            constructor() { this.ctx = null; this.muted = false; this.volume = 0.3; }
            init() { 
                if (!this.ctx) {
                    try {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch(e){}
                }
            }
            playTone(freq, duration, type = 'sine') {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            soundMove() { this.playTone(200, 0.04, 'square'); }
            soundRotate() { this.playTone(400, 0.06, 'triangle'); }
            soundDrop() { this.playTone(120, 0.1, 'sawtooth'); }
            soundClear() { this.playTone(523, 0.1); setTimeout(()=>this.playTone(659, 0.15), 100); }
            soundLevelUp() { [400, 500, 600, 800].forEach((f, i) => setTimeout(() => this.playTone(f, 0.12), i * 80)); }
            soundGameOver() { [300, 200, 100].forEach((f, i) => setTimeout(() => this.playTone(f, 0.2, 'sawtooth'), i * 120)); }
        }

        const audio = new SoundEngine();
        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
            if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        let arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0, level: 1, lines: 0 };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;
        let isGameOver = false;

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerRotate(dir) {
            if (isPaused) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
            audio.soundRotate();
            saveState();
        }

        function playerMove(dir) {
            if (isPaused) return;
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
            else {
                audio.soundMove();
                saveState();
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                isGameOver = true;
                isPaused = true;
                overlay.innerText = 'Game Over!\nTap Restart';
                overlay.style.display = 'flex';
                audio.soundGameOver();
                clearState();
            } else {
                saveState();
            }
        }

        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                rowCount++;
            }

            if (rowCount > 0) {
                player.score += rowCount * 4;
                player.lines += rowCount;
                audio.soundClear();

                const newLevel = Math.floor(player.score / 100) + 1;
                if (newLevel > player.level) {
                    player.level = newLevel;
                    dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                    audio.soundLevelUp();
                    clearTopFourLines();
                }
                updateScoreUI();
            }
        }

        function clearTopFourLines() {
            let cleared = 0;
            for (let y = 0; y < arena.length && cleared < 4; y++) {
                if (arena[y].some(val => val !== 0)) {
                    arena.splice(y, 1);
                    arena.unshift(new Array(12).fill(0));
                    cleared++;
                }
            }
        }

        function playerDrop() {
            if (isPaused) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                audio.soundDrop();
                arenaSweep();
                playerReset();
            } else {
                saveState();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            if (isPaused) return;
            while (!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            merge(arena, player);
            audio.soundDrop();
            arenaSweep();
            playerReset();
            dropCounter = 0;
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.lineWidth = 0.05;
                        context.strokeStyle = '#000';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#050505';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            if (player.matrix) drawMatrix(player.matrix, player.pos);
        }

        function update(time = 0) {
            if (isPaused) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
        }

        // --- Persistent Storage Management ---
        function saveState() {
            if (isGameOver) return;
            try {
                const data = JSON.stringify({ arena, player, isGameOver });
                localStorage.setItem('tetris_save', data);
            } catch(e){}
        }

        function loadSavedState() {
            try {
                const data = localStorage.getItem('tetris_save');
                if (data) {
                    const saved = JSON.parse(data);
                    if (saved && !saved.isGameOver && saved.player.matrix) {
                        arena = saved.arena;
                        player.score = saved.player.score;
                        player.level = saved.player.level;
                        player.lines = saved.player.lines;
                        player.matrix = saved.player.matrix;
                        player.pos = saved.player.pos;
                        dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                        updateScoreUI();
                        draw();
                        overlay.innerText = 'Game Loaded!\nTap to Resume';
                        return true;
                    }
                }
            } catch(e){}
            return false;
        }

        function clearState() {
            try { localStorage.removeItem('tetris_save'); } catch(e){}
        }

        function startGame() {
            audio.init();
            if (isGameOver || !player.matrix) {
                resetGame();
            }
            isPaused = false;
            overlay.style.display = 'none';
            lastTime = performance.now();
            update();
        }

        overlay.onclick = startGame;
        document.getElementById('btn-start').onclick = startGame;

        document.getElementById('btn-pause').onclick = () => {
            isPaused = true;
            overlay.innerText = 'Paused\nTap to Continue';
            overlay.style.display = 'flex';
            saveState();
        };

        document.getElementById('btn-restart').onclick = () => {
            audio.init();
            resetGame();
            startGame();
        };

        function resetGame() {
            arena = createMatrix(12, 20);
            player.score = 0; player.level = 1; player.lines = 0;
            isGameOver = false; dropInterval = 1000;
            updateScoreUI();
            playerReset();
        }

        // Controls
        document.addEventListener('keydown', e => {
            if (isPaused) return;
            if (e.keyCode === 37) playerMove(-1);
            else if (e.keyCode === 39) playerMove(1);
            else if (e.keyCode === 40) playerDrop();
            else if (e.keyCode === 38) playerRotate(1);
            else if (e.keyCode === 32) playerHardDrop();
        });

        let touchStartX = 0, touchMoved = false;
        canvas.addEventListener('touchstart', e => {
            audio.init();
            touchStartX = e.touches[0].clientX;
            touchMoved = false;
        }, {passive: true});

        canvas.addEventListener('touchmove', e => {
            if (isPaused) return;
            const diffX = e.touches[0].clientX - touchStartX;
            if (Math.abs(diffX) > 20) {
                playerMove(diffX > 0 ? 1 : -1);
                touchStartX = e.touches[0].clientX;
                touchMoved = true;
            }
        }, {passive: true});

        canvas.addEventListener('touchend', () => {
            if (!isPaused && !touchMoved) playerRotate(1);
        });

        // Remote
        document.getElementById('rm-left').onclick = () => playerMove(-1);
        document.getElementById('rm-right').onclick = () => playerMove(1);
        document.getElementById('rm-rotate').onclick = () => playerRotate(1);
        document.getElementById('rm-down').onclick = () => playerDrop();
        document.getElementById('rm-drop').onclick = () => playerHardDrop();

        // Sound Buttons
        document.getElementById('btn-mute').onclick = function() {
            audio.muted = !audio.muted;
            this.innerText = `Mute: ${audio.muted ? 'ON' : 'OFF'}`;
        };
        document.getElementById('btn-vol-up').onclick = () => audio.volume = Math.min(1, audio.volume + 0.1);
        document.getElementById('btn-vol-down').onclick = () => audio.volume = Math.max(0, audio.volume - 0.1);

        // Auto Load on Boot
        window.onload = () => {
            const loaded = loadSavedState();
            if (!loaded) {
                overlay.innerText = 'Click / Tap to Start';
                draw();
            }
        };
    </script>

  <div id="bottom-ad-container">
    <button id="close-ad-btn" onclick="closeAd()" aria-label="Close Ad">✕</button>
    
    <a id="ad-link" href="#" target="_blank" rel="noopener noreferrer">
        <img id="ad-image" src="" alt="Advertisement">
        <span id="ad-text"></span>
    </a>
</div>

<style>
/* Ad Banner CSS */
#bottom-ad-container {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #fff9f2; /* विज्ञापन का बैकग्राउंड कलर */
    border-top: 3px solid #e67e22; /* Primary Theme Color */
    box-shadow: 0 -3px 15px rgba(0,0,0,0.2);
    z-index: 99999;
    display: none; /* शुरुआत में छुपा रहेगा, JS से लाइव होगा */
    box-sizing: border-box;
}

/* पूरे विज्ञापन लिंक को ब्लॉक बनाना ताकि कहीं भी क्लिक हो सके */
#ad-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px; /* इमेज और टेक्स्ट के बीच की दूरी */
    padding: 10px 40px 10px 20px; /* क्लोज बटन के लिए राइट में जगह छोड़ी */

}

#ad-image {

#close-ad-btn {
    position: absolute;

/* मुख्य बॉडी की पैडिंग बढ़ाएं ताकि कंटेंट विज्ञापन के पीछे न छुपे */
body { padding-bottom: 160px !important; }

<script>
    // 🔗 Google Sheet CSV URL (Isse aap change bhi kar sakte hain)
    const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTyBbzCSmhFRRf3XeTPSKeXTyTxG1xqqXMbg6egp-4c41x527lUtLjAFwTjb_JQlQlT3lsfy-0CEtxm/pub?output=csv'; 
    const rotationInterval = 10000; 

    let adsData = [];
    let currentAdIndex = 0;
    let rotationTimer = null;

    const dbName = "AdRotationDB";
    const storeName = "adsStore";

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) {
                    db.createObjectStore(storeName, { keyPath: "id" });
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e.target.error);
        });
    }

    async function saveAdsToLocal(ads) {
        try {
            const db = await openDB();
            const tx = db.transaction(storeName, "readwrite");
            const store = tx.objectStore(storeName);
            store.put({ id: "cachedAds", data: ads, timestamp: Date.now() });
        } catch(e) { console.error(e); }
    }

    async function getAdsFromLocal() {
        try {
            const db = await openDB();
            return new Promise((resolve) => {
                const tx = db.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const request = store.get("cachedAds");
                request.onsuccess = () => resolve(request.result ? request.result.data : null);
                request.onerror = () => resolve(null);
            });
        } catch(e) { return null; }
    }

    function parseAdsCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        const result = [];
        if(lines.length < 2) return result;
        const headers = lines[0].split(',');

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i]) continue;
            const currentLine = lines[i].split(',');
            if (currentLine.length >= 3) {
                result.push({
                    image: currentLine[0].trim(),
                    url: currentLine[1].trim(),
                    alt: currentLine[2].trim()
                });
            }
        }
        return result;
    }

    async function initAdsRotation() {
        adsData = await getAdsFromLocal() || [];
        if(adsData.length > 0) {
            showAd();
            startRotation();
        }
        
        try {
            const response = await fetch(sheetCsvUrl);
            if(response.ok) {
                const text = await response.text();
                const freshAds = parseAdsCSV(text);
                if(freshAds.length > 0) {
                    adsData = freshAds;
                    saveAdsToLocal(freshAds);
                    if(!rotationTimer) {
                        showAd();
                        startRotation();
                    }
                }
            }
        } catch(e) {
            console.log("Offline or Ads fetch failed, using local backup.");
        }
    }

    function showAd() {
        if(adsData.length === 0) return;
        const ad = adsData[currentAdIndex];
        const container = document.getElementById("bottom-ad-container");
        const img = document.getElementById("ad-image");
        const link = document.getElementById("ad-link");
        const txt = document.getElementById("ad-text");

        if(container && img && link && txt) {
            img.src = ad.image;
            img.alt = ad.alt;
            link.href = ad.url;
            txt.innerText = ad.alt; 
            container.style.display = "block";
        }
    }

    function startRotation() {
        if(adsData.length <= 1) return;
        rotationTimer = setInterval(() => {
            currentAdIndex = (currentAdIndex + 1) % adsData.length;
            showAd();
        }, rotationInterval);
    }

    function closeAd() {
        clearInterval(rotationTimer);
        const container = document.getElementById("bottom-ad-container");
        if(container) container.style.display = "none";
    }

    // Is script block ko agar dusre page par call kar rahe hain toh window onload par 'initAdsRotation()' run karein.
    if (window.attachEvent) {window.attachEvent('onload', initAdsRotation);}
    else if (window.addEventListener) {window.addEventListener('load', initAdsRotation, false);}
    else {document.addEventListener("DOMContentLoaded", initAdsRotation);}
</script>
