<div id="blogger-app-wrapper">
  <!-- External Resources -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* Global Container Scope */
    #blogger-app-wrapper {
      background-color: #1e1e2e !important;
      color: #cdd6f4 !important;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 650px;
      height: 85vh;
      display: flex;
      border: 1px solid #45475a;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0;
    }
    #blogger-app-wrapper * { box-sizing: border-box; }

    #app { display: flex; width: 100%; height: 100%; }

    /* Left Sidebar: Multi-Pages */
    #sidebar {
      width: 220px;
      background: #2b2b3d;
      border-right: 1px solid #45475a;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 12px;
      font-weight: bold;
      border-bottom: 1px solid #45475a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #74c7ec;
    }
    .page-list { list-style: none !important; margin: 0 !important; padding: 0 !important; overflow-y: auto; flex: 1; }
    .page-item {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #cdd6f4;
    }
    .page-item.active { background: #3b3b52; border-left: 4px solid #74c7ec; }
    .page-info { display: flex; align-items: center; gap: 8px; }
    .page-icon-img { width: 18px; height: 18px; object-fit: cover; border-radius: 3px; }

    /* Main Content */
    #main-content { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    /* Toolbar */
    .toolbar {
      padding: 10px;
      background: #2b2b3d;
      border-bottom: 1px solid #45475a;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #1e1e2e;
      border: 1px solid #45475a;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .address-bar input {
      width: 100%;
      background: transparent;
      border: none;
      color: #cdd6f4;
      outline: none;
      font-size: 13px;
    }

    /* Split Workspace */
    .workspace { display: flex; flex: 1; overflow: hidden; }

    /* Left Panel: Folder Tree Navigation */
    .tree-panel {
      width: 260px;
      border-right: 1px solid #45475a;
      overflow-y: auto;
      padding: 10px;
      background: #232334;
    }
    .tree-node { margin-left: 12px; }
    .tree-content {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      color: #cdd6f4;
    }
    .tree-content:hover { background: #33334d; }
    .tree-content.selected-folder { background: #45475a; border-left: 3px solid #74c7ec; color: #74c7ec; font-weight: bold; }
    .btn-toggle {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #45475a;
      border: none;
      color: #cdd6f4;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }

    /* Right Panel: Selected Folder Content Detail */
    .content-panel { flex: 1; overflow-y: auto; padding: 15px; background: #1e1e2e; display: flex; flex-direction: column; gap: 15px; }
    
    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: #74c7ec;
      border-bottom: 1px solid #45475a;
      padding-bottom: 5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Subfolders Grid View */
    .subfolders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .subfolder-card {
      background: #2b2b3d;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .subfolder-card:hover { transform: translateY(-2px); background: #33334d; border-color: #74c7ec; }
    .subfolder-card .folder-icon { font-size: 24px; margin-bottom: 5px; }
    .subfolder-card .folder-name { font-size: 12px; font-weight: 600; color: #cdd6f4; word-break: break-all; }
    .subfolder-card .folder-actions { margin-top: 6px; display: flex; gap: 5px; }

    /* Files List Table */
    .files-table-container { width: 100%; overflow-x: auto; }
    .files-table { width: 100%; border-collapse: collapse; text-align: left; }
    .files-table th, .files-table td { padding: 8px 12px; border-bottom: 1px solid #45475a; font-size: 13px; color: #cdd6f4; }
    .files-table th { background: #2b2b3d; }
    .files-table tr:hover { background: #28283d; }
    .hidden-item { opacity: 0.4; }

    /* Action Buttons */
    .btn-bx {
      background: #74c7ec;
      color: #11111b;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-bx:hover { opacity: 0.9; }
    .btn-danger-bx { background: #f38ba8; color: #fff; }
    .btn-sm-bx { padding: 2px 6px; font-size: 11px; }

    /* Modals */
    .bx-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .bx-modal.active { display: flex; }
    .bx-modal-content {
      background: #2b2b3d;
      padding: 20px;
      border-radius: 6px;
      width: 350px;
      border: 1px solid #45475a;
      color: #cdd6f4;
    }
    .bx-form-group { margin-bottom: 10px; }
    .bx-form-group label { display: block; margin-bottom: 4px; font-size: 12px; }
    .bx-form-group input, .bx-form-group select {
      width: 100%;
      padding: 6px;
      background: #1e1e2e;
      border: 1px solid #45475a;
      color: #cdd6f4;
      border-radius: 4px;
    }
  </style>

  <div id="app">
    <!-- Pages Sidebar -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span><i class="fa-solid fa-layer-group"></i> Pages</span>
        <button class="btn-bx btn-sm-bx" onclick="openPageModal()"><i class="fa-solid fa-plus"></i></button>
      </div>
      <ul class="page-list" id="pageList"></ul>
    </div>

    <!-- Main Workspace -->
    <div id="main-content">
      <div class="toolbar">
        <div class="address-bar">
          <i class="fa-solid fa-folder-open" style="margin-right: 6px; color: #74c7ec;"></i>
          <input type="text" id="currentPathInput" placeholder="/Path" onkeydown="handlePathSubmit(event)">
        </div>
        <button class="btn-bx" onclick="openItemModal()"><i class="fa-solid fa-plus"></i> Add Item</button>
        <button class="btn-bx" onclick="exportCSV()"><i class="fa-solid fa-file-csv"></i> CSV</button>
        <button class="btn-bx" onclick="importCSVTrigger()"><i class="fa-solid fa-file-import"></i> Import</button>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn-bx" onclick="exportPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
      </div>

      <div class="workspace">
        <!-- Tree View Panel -->
        <div class="tree-panel" id="treeView"></div>

        <!-- Selected Folder Contents Panel -->
        <div class="content-panel">
          <!-- Subfolders Section -->
          <div>
            <div class="section-title">
              <i class="fa-solid fa-folder-tree"></i> Sub-Folders in <span id="selectedFolderName" style="color:#fff;">/</span>
            </div>
            <div class="subfolders-grid" id="subfoldersGrid"></div>
          </div>

          <!-- Files Section -->
          <div>
            <div class="section-title">
              <i class="fa-solid fa-file-code"></i> Files in <span id="selectedFolderNameFiles" style="color:#fff;">/</span>
            </div>
            <div class="files-table-container">
              <table class="files-table">
                <thead>
                  <tr>
                    <th>Icon</th>
                    <th>Name</th>
                    <th>Path</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="filesTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Item Modal -->
  <div class="bx-modal" id="itemModal">
    <div class="bx-modal-content">
      <h4 id="itemModalTitle" style="margin-bottom:10px;">Add/Edit Item</h4>
      <input type="hidden" id="editItemId">
      <div class="bx-form-group">
        <label>Type</label>
        <select id="itemType">
          <option value="folder">Folder</option>
          <option value="file">File</option>
          <option value="drive">Drive</option>
        </select>
      </div>
      <div class="bx-form-group">
        <label>Name</label>
        <input type="text" id="itemName" placeholder="e.g. Documents or report.pdf">
      </div>
      <div class="bx-form-group">
        <label>Path (Parent Path)</label>
        <input type="text" id="itemPath" placeholder="e.g. /C Drive">
      </div>
      <div class="bx-form-group">
        <label>Icon (Emoji)</label>
        <input type="text" id="itemIcon" placeholder="📁 or 📄">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
        <button class="btn-bx btn-danger-bx" onclick="closeModal('itemModal')">Cancel</button>
        <button class="btn-bx" onclick="saveItem()">Save</button>
      </div>
    </div>
  </div>

  <!-- Page Modal -->
  <div class="bx-modal" id="pageModal">
    <div class="bx-modal-content">
      <h4 id="pageModalTitle" style="margin-bottom:10px;">Manage Page</h4>
      <input type="hidden" id="editPageId">
      <div class="bx-form-group">
        <label>Page Name</label>
        <input type="text" id="pageName" placeholder="e.g. Work Drives">
      </div>
      <div class="bx-form-group">
        <label>Icon Image URL</label>
        <input type="text" id="pageIconUrl" placeholder="https://example.com/icon.png">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
        <button class="btn-bx btn-danger-bx" onclick="closeModal('pageModal')">Cancel</button>
        <button class="btn-bx" onclick="savePage()">Save Page</button>
      </div>
    </div>
  </div>

  <script>
  (function() {
    const DB_NAME = "BloggerExplorerSplitDB";
    const DB_VERSION = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("pages")) db.createObjectStore("pages", { keyPath: "id" });
          if (!db.objectStoreNames.contains("items")) db.createObjectStore("items", { keyPath: "id" });
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(db); };
        request.onerror = (e) => reject(e);
      });
    }

    function dbTx(storeName, mode, callback) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        const res = callback(store);
        tx.oncomplete = () => resolve(res);
        tx.onerror = (e) => reject(e);
      });
    }

    let currentPageId = "default";
    let currentPath = "/";
    let pages = [];
    let items = [];
    let collapsedNodes = new Set();

    window.addEventListener("load", async () => {
      await initDB();
      await loadData();
      window.addEventListener("hashchange", handleHashChange);
      if (!location.hash) location.hash = "#" + currentPageId;
      else handleHashChange();
    });

    async function loadData() {
      const loadedPages = await dbTx("pages", "readonly", s => new Promise(res => {
        const req = s.getAll();
        req.onsuccess = () => res(req.result);
      }));

      if (loadedPages.length === 0) {
        const defaultPage = { id: "default", name: "Main Explorer", icon: "" };
        await dbTx("pages", "readwrite", s => s.add(defaultPage));
        pages = [defaultPage];
        
        items = [
          { id: "1", pageId: "default", name: "C Drive", path: "/", type: "drive", icon: "💻", hidden: false },
          { id: "2", pageId: "default", name: "Windows", path: "/C Drive", type: "folder", icon: "📁", hidden: false },
          { id: "3", pageId: "default", name: "System32", path: "/C Drive/Windows", type: "folder", icon: "📁", hidden: false },
          { id: "4", pageId: "default", name: "cmd.exe", path: "/C Drive/Windows/System32", type: "file", icon: "⚙️", hidden: false },
          { id: "5", pageId: "default", name: "notepad.exe", path: "/C Drive/Windows/System32", type: "file", icon: "📝", hidden: false },
          { id: "6", pageId: "default", name: "Logs", path: "/C Drive/Windows", type: "folder", icon: "📁", hidden: false }
        ];
        for (let item of items) await dbTx("items", "readwrite", s => s.add(item));
      } else {
        pages = loadedPages;
        items = await dbTx("items", "readonly", s => new Promise(res => {
          const req = s.getAll();
          req.onsuccess = () => res(req.result);
        }));
      }
    }

    function handleHashChange() {
      const hash = location.hash.replace("#", "");
      const page = pages.find(p => p.id === hash || p.name === decodeURIComponent(hash));
      if (page) currentPageId = page.id;
      else if (pages.length > 0) currentPageId = pages[0].id;
      renderApp();
    }

    function renderApp() {
      renderPagesList();
      renderTree();
      renderSelectedFolderContents();
      document.getElementById("currentPathInput").value = currentPath;
    }

    function renderPagesList() {
      const pageListEl = document.getElementById("pageList");
      pageListEl.innerHTML = "";
      pages.forEach(p => {
        const li = document.createElement("li");
        li.className = `page-item ${p.id === currentPageId ? 'active' : ''}`;
        li.onclick = () => { location.hash = "#" + p.id; };
        const imgHtml = p.icon ? `<img src="${p.icon}" class="page-icon-img">` : `<i class="fa-solid fa-folder"></i>`;
        li.innerHTML = `
          <div class="page-info">${imgHtml}<span>${p.name}</span></div>
          <div>
            <i class="fa-solid fa-pen" style="font-size:11px; margin-right:5px;" onclick="event.stopPropagation(); openPageModal('${p.id}')"></i>
            <i class="fa-solid fa-trash" style="font-size:11px; color:#f38ba8;" onclick="event.stopPropagation(); deletePage('${p.id}')"></i>
          </div>`;
        pageListEl.appendChild(li);
      });
    }

    /* LEFT PANEL TREE VIEW */
    function renderTree() {
      const treeContainer = document.getElementById("treeView");
      treeContainer.innerHTML = "";
      const currentItems = items.filter(i => i.pageId === currentPageId);
      const treeMap = buildTreeStructure(currentItems);
      const rootUl = document.createElement("div");
      renderTreeNodes(treeMap, rootUl, "/");
      treeContainer.appendChild(rootUl);
    }

    function buildTreeStructure(itemList) {
      let root = { name: "Root", path: "/", children: [] };
      itemList.forEach(item => {
        if (item.type === "file") return;
        let fullPath = (item.path === "/" ? "" : item.path) + "/" + item.name;
        root.children.push({ item: item, fullPath: fullPath, children: [] });
      });
      return root;
    }

    function renderTreeNodes(node, container, currentParentPath) {
      node.children.forEach(child => {
        const nodeDiv = document.createElement("div");
        nodeDiv.className = "tree-node";
        const isCollapsed = collapsedNodes.has(child.fullPath);
        const subItems = items.filter(i => i.pageId === currentPageId && i.path === child.fullPath && i.type !== "file");
        const hasChildren = subItems.length > 0;

        const contentDiv = document.createElement("div");
        contentDiv.className = `tree-content ${child.fullPath === currentPath ? 'selected-folder' : ''}`;
        
        const toggleBtn = document.createElement("button");
        toggleBtn.className = "btn-toggle";
        toggleBtn.textContent = isCollapsed ? "+" : "-";
        toggleBtn.onclick = (e) => {
          e.stopPropagation();
          if (collapsedNodes.has(child.fullPath)) collapsedNodes.delete(child.fullPath);
          else collapsedNodes.add(child.fullPath);
          renderTree();
        };

        if (!hasChildren) toggleBtn.style.visibility = "hidden";

        contentDiv.appendChild(toggleBtn);
        contentDiv.innerHTML += `<span>${child.item.icon || '📁'}</span> <span>${child.item.name}</span>`;
        contentDiv.onclick = () => setPath(child.fullPath);

        nodeDiv.appendChild(contentDiv);

        if (hasChildren && !isCollapsed) {
          const childrenContainer = document.createElement("div");
          let childNodeMock = {
            children: items.filter(i => i.pageId === currentPageId && i.path === child.fullPath && i.type !== "file").map(i => ({
              item: i, fullPath: child.fullPath + "/" + i.name, children: []
            }))
          };
          renderTreeNodes(childNodeMock, childrenContainer, child.fullPath);
          nodeDiv.appendChild(childrenContainer);
        }
        container.appendChild(nodeDiv);
      });
    }

    /* RIGHT PANEL CONTENT VIEW */
    function renderSelectedFolderContents() {
      document.getElementById("selectedFolderName").textContent = currentPath;
      document.getElementById("selectedFolderNameFiles").textContent = currentPath;

      const grid = document.getElementById("subfoldersGrid");
      const filesTable = document.getElementById("filesTableBody");
      grid.innerHTML = "";
      filesTable.innerHTML = "";

      // Fetch Subfolders
      const subfolders = items.filter(i => i.pageId === currentPageId && i.path === currentPath && i.type !== 'file');
      if (subfolders.length === 0) {
        grid.innerHTML = `<span style="font-size:12px; color:#888;">No sub-folders in this folder</span>`;
      } else {
        subfolders.forEach(sf => {
          const targetPath = (currentPath === '/' ? '' : currentPath) + '/' + sf.name;
          const card = document.createElement("div");
          card.className = `subfolder-card ${sf.hidden ? 'hidden-item' : ''}`;
          card.onclick = () => setPath(targetPath);
          card.innerHTML = `
            <div class="folder-icon">${sf.icon || '📁'}</div>
            <div class="folder-name">${sf.name}</div>
            <div class="folder-actions" onclick="event.stopPropagation();">
              <button class="btn-bx btn-sm-bx" onclick="openItemModal('${sf.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-bx btn-sm-bx btn-danger-bx" onclick="deleteItem('${sf.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      // Fetch Files
      const files = items.filter(i => i.pageId === currentPageId && i.path === currentPath && i.type === 'file');
      if (files.length === 0) {
        filesTable.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">No files in this folder</td></tr>`;
      } else {
        files.forEach(f => {
          const tr = document.createElement("tr");
          if (f.hidden) tr.className = "hidden-item";
          tr.innerHTML = `
            <td>${f.icon || '📄'}</td>
            <td><strong>${f.name}</strong></td>
            <td>${f.path}</td>
            <td>
              <button class="btn-bx btn-sm-bx" onclick="toggleHideItem('${f.id}')">
                <i class="fa-solid ${f.hidden ? 'fa-eye-slash' : 'fa-eye'}"></i> ${f.hidden ? 'Hidden' : 'Visible'}
              </button>
            </td>
            <td>
              <button class="btn-bx btn-sm-bx" onclick="openItemModal('${f.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-bx btn-sm-bx btn-danger-bx" onclick="deleteItem('${f.id}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          `;
          filesTable.appendChild(tr);
        });
      }
    }

    window.setPath = function(path) {
      currentPath = path;
      document.getElementById("currentPathInput").value = currentPath;
      renderTree();
      renderSelectedFolderContents();
    };

    window.handlePathSubmit = function(e) {
      if (e.key === "Enter") setPath(e.target.value);
    };

    window.openItemModal = function(id = null) {
      document.getElementById("itemModal").classList.add("active");
      if (id) {
        const item = items.find(i => i.id === id);
        document.getElementById("editItemId").value = item.id;
        document.getElementById("itemName").value = item.name;
        document.getElementById("itemPath").value = item.path;
        document.getElementById("itemType").value = item.type;
        document.getElementById("itemIcon").value = item.icon;
      } else {
        document.getElementById("editItemId").value = "";
        document.getElementById("itemName").value = "";
        document.getElementById("itemPath").value = currentPath;
        document.getElementById("itemIcon").value = "📁";
      }
    };

    window.saveItem = async function() {
      const id = document.getElementById("editItemId").value || Date.now().toString();
      const newItem = {
        id: id,
        pageId: currentPageId,
        name: document.getElementById("itemName").value,
        path: document.getElementById("itemPath").value,
        type: document.getElementById("itemType").value,
        icon: document.getElementById("itemIcon").value,
        hidden: false
      };
      await dbTx("items", "readwrite", s => s.put(newItem));
      const idx = items.findIndex(i => i.id === id);
      if (idx > -1) items[idx] = newItem;
      else items.push(newItem);
      closeModal("itemModal");
      renderApp();
    };

    window.toggleHideItem = async function(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.hidden = !item.hidden;
        await dbTx("items", "readwrite", s => s.put(item));
        renderApp();
      }
    };

    window.deleteItem = async function(id) {
      if (confirm("Delete this item?")) {
        await dbTx("items", "readwrite", s => s.delete(id));
        items = items.filter(i => i.id !== id);
        renderApp();
      }
    };

    window.openPageModal = function(id = null) {
      document.getElementById("pageModal").classList.add("active");
      if (id) {
        const page = pages.find(p => p.id === id);
        document.getElementById("editPageId").value = page.id;
        document.getElementById("pageName").value = page.name;
        document.getElementById("pageIconUrl").value = page.icon || "";
      } else {
        document.getElementById("editPageId").value = "";
        document.getElementById("pageName").value = "";
        document.getElementById("pageIconUrl").value = "";
      }
    };

    window.savePage = async function() {
      const id = document.getElementById("editPageId").value || "page_" + Date.now();
      const newPage = {
        id: id,
        name: document.getElementById("pageName").value,
        icon: document.getElementById("pageIconUrl").value
      };
      await dbTx("pages", "readwrite", s => s.put(newPage));
      const idx = pages.findIndex(p => p.id === id);
      if (idx > -1) pages[idx] = newPage;
      else pages.push(newPage);
      closeModal("pageModal");
      location.hash = "#" + id;
    };

    window.deletePage = async function(id) {
      if (pages.length <= 1) return alert("Must keep at least 1 page.");
      if (confirm("Delete this page?")) {
        await dbTx("pages", "readwrite", s => s.delete(id));
        pages = pages.filter(p => p.id !== id);
        const pageItems = items.filter(i => i.pageId === id);
        for (let item of pageItems) await dbTx("items", "readwrite", s => s.delete(item.id));
        items = items.filter(i => i.pageId !== id);
        location.hash = "#" + pages[0].id;
      }
    };

    window.closeModal = function(id) {
      document.getElementById(id).classList.remove("active");
    };

    window.exportCSV = function() {
      let csvContent = "data:text/csv;charset=utf-8,ID,PageID,Name,Path,Type,Icon,Hidden\n";
      items.forEach(i => {
        csvContent += `"${i.id}","${i.pageId}","${i.name}","${i.path}","${i.type}","${i.icon}","${i.hidden}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `explorer_${currentPageId}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.importCSVTrigger = function() {
      document.getElementById("csvFileInput").click();
    };

    window.importCSV = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        const lines = e.target.result.split("\n");
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cols = lines[i].split(",").map(c => c.replace(/"/g, "").trim());
          if (cols.length >= 6) {
            const item = {
              id: cols[0] || Date.now().toString() + i,
              pageId: cols[1] || currentPageId,
              name: cols[2], path: cols[3], type: cols[4], icon: cols[5], hidden: cols[6] === "true"
            };
            await dbTx("items", "readwrite", s => s.put(item));
            const idx = items.findIndex(it => it.id === item.id);
            if (idx > -1) items[idx] = item;
            else items.push(item);
          }
        }
        renderApp();
        alert("CSV Imported!");
      };
      reader.readAsText(file);
    };

    window.exportPDF = function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text(`Explorer Report - Page: ${currentPageId}`, 14, 15);
      doc.text(`Path: ${currentPath}`, 14, 22);
      const visibleItems = items.filter(i => i.pageId === currentPageId && i.path === currentPath);
      const tableData = visibleItems.map(i => [i.type, i.name, i.path, i.hidden ? 'Hidden' : 'Visible']);
      doc.autoTable({ head: [['Type', 'Name', 'Path', 'Status']], body: tableData, startY: 30 });
      doc.save(`Explorer_${currentPageId}.pdf`);
    };
  })();
  </script>
</div>
