<div id="alarm-reminder-box">
  <style>
    #alarm-reminder-box {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      padding: 20px;
      border-radius: 12px;
      max-width: 650px;
      margin: 15px auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #alarm-reminder-box h3 { margin: 0 0 15px 0; color: #60a5fa; }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-size: 13px; margin-bottom: 5px; color: #9ca3af; }
    .form-row input, .form-row textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      box-sizing: border-box;
    }
    .btn-row { display: flex; gap: 10px; margin-top: 15px; }
    .alarm-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .alarm-btn:hover { background: #1d4ed8; }
    .test-btn { background: #059669; }
    .test-btn:hover { background: #047857; }
    .event-card {
      background: #1f2937;
      border: 1px solid #374151;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* स्क्रीन पर दिखने वाला अलर्ट */
    #active-alarm-popup {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      background: #b91c1c;
      color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 999999;
      max-width: 350px;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }
  </style>

  <!-- स्क्रीन पर पॉप-अप अलर्ट -->
  <div id="active-alarm-popup">
    <h4 id="popup-title" style="margin:0 0 5px 0; font-size:18px;">🔔 इवेंट का समय हो गया!</h4>
    <p id="popup-desc" style="margin:0 0 10px 0; font-size:14px;"></p>
    <button onclick="dismissAlarm()" style="background:#fff; color:#000; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">बंद करें (Dismiss)</button>
  </div>

  <h3>⏰ इवेंट और अलार्म शेड्यूलर</h3>
  
  <div class="form-row">
    <label>इवेंट का नाम:</label>
    <input type="text" id="ev-name" placeholder="उदा. मीटिंग, दवाई का समय">
  </div>
  <div class="form-row">
    <label>तारीख और समय चुनें:</label>
    <input type="datetime-local" id="ev-time">
  </div>
  
  <div class="btn-row">
    <button class="alarm-btn" id="save-ev-btn">इवेंट सेव करें</button>
    <button class="alarm-btn test-btn" id="sound-test-btn">🔊 साउंड और अलर्ट टेस्ट करें</button>
  </div>

  <div id="events-display" style="margin-top: 20px;"></div>

  <script>
    let audioCtx = null;
    let alarmInterval = null;

    // बीप साउंड बजाना
    function startAlarmSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (alarmInterval) return;

        alarmInterval = setInterval(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }, 600);
      } catch (e) {
        console.log("Audio error", e);
      }
    }

    function stopAlarmSound() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    // अलर्ट पॉप-अप दिखाना
    function showAlert(title, desc) {
      startAlarmSound();
      const popup = document.getElementById("active-alarm-popup");
      document.getElementById("popup-title").innerText = "🔔 " + title;
      document.getElementById("popup-desc").innerText = desc || "समय हो गया है!";
      popup.style.display = "block";

      // साथ ही सिस्टम नोटिफिकेशन की कोशिश करें
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body: desc });
      }
    }

    function dismissAlarm() {
      stopAlarmSound();
      document.getElementById("active-alarm-popup").style.display = "none";
    }

    // टेस्ट बटन
    document.getElementById("sound-test-btn").onclick = function() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
      showAlert("टेस्ट अलर्ट!", "अगर आपको आवाज़ आ रही है और यह लाल बॉक्स दिख रहा है, तो सिस्टम सही काम कर रहा है।");
    };

    // IndexedDB स्टोरेज
    let db;
    const req = indexedDB.open("BloggerEventsSafeDB", 1);
    req.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("items")) {
        db.createObjectStore("items", { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      loadEvents();
    };

    function loadEvents() {
      const tx = db.transaction("items", "readonly");
      const store = tx.objectStore("items");
      const listReq = store.getAll();
      listReq.onsuccess = () => {
        const items = listReq.result || [];
        const container = document.getElementById("events-display");
        if (!items.length) {
          container.innerHTML = "<p style='color:#9ca3af;'>कोई शेड्यूल्ड इवेंट नहीं है।</p>";
          return;
        }
        container.innerHTML = items.map(it => `
          <div class="event-card">
            <div>
              <strong>${it.name}</strong><br>
              <small style="color:#9ca3af;">${new Date(it.time).toLocaleString()}</small>
            </div>
            <button onclick="removeEvent(${it.id})" style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">हटाएँ</button>
          </div>
        `).join('');
      };
    }

    document.getElementById("save-ev-btn").onclick = function() {
      const name = document.getElementById("ev-name").value.trim();
      const time = document.getElementById("ev-time").value;
      if (!name || !time) {
        alert("कृपया नाम और समय दोनों भरें!");
        return;
      }
      
      // ऑडियो संदर्भ शुरू करने के लिए परमिशन
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }

      const tx = db.transaction("items", "readwrite");
      tx.objectStore("items").add({ name, time, notified: false });
      tx.oncomplete = () => {
        document.getElementById("ev-name").value = "";
        document.getElementById("ev-time").value = "";
        loadEvents();
        alert("इवेंट सेव हो गया!");
      };
    };

    window.removeEvent = function(id) {
      const tx = db.transaction("items", "readwrite");
      tx.objectStore("items").delete(id);
      tx.oncomplete = loadEvents;
    };

    // टाइमर चेक (हर 3 सेकंड)
    setInterval(() => {
      if (!db) return;
      const tx = db.transaction("items", "readwrite");
      const store = tx.objectStore("items");
      const req = store.getAll();
      req.onsuccess = () => {
        const now = Date.now();
        const items = req.result || [];
        items.forEach(it => {
          const evTime = new Date(it.time).getTime();
          if (!it.notified && now >= evTime) {
            showAlert("इवेंट रिमाइंडर: " + it.name, "निर्धारित समय आ गया है।");
            it.notified = true;
            const upTx = db.transaction("items", "readwrite");
            upTx.objectStore("items").put(it);
          }
        });
      };
    }, 3000);
  </script>
</div>
