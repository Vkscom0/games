<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अबैकस कैलकुलेटर</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        input, select { padding: 10px; font-size: 16px; margin: 5px; width: 80px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; font-size: 20px; font-weight: bold; }
        
        /* अबैकस स्टाइलिंग */
        .abacus { display: inline-flex; gap: 15px; margin-top: 30px; border: 4px solid #5c3a21; padding: 15px; background: #f4e1d2; border-radius: 5px; }
        .rod { display: flex; flex-direction: column; align-items: center; width: 30px; height: 180px; background: #000; position: relative; }
        .beam { position: absolute; top: 50px; width: 40px; height: 6px; background: #5c3a21; z-index: 2; }
        .bead { width: 26px; height: 14px; background: #cc2929; border-radius: 10px; margin: 2px 0; z-index: 3; transition: transform 0.2s; }
        .upper { position: absolute; top: 5px; }
        .lower { position: absolute; bottom: 5px; display: flex; flex-direction: column-reverse; }
    </style>
</head>
<body>

    <h2>अबैकस कैलकुलेटर</h2>
    
    <input type="number" id="num1" placeholder="नंबर 1">
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select>
    <input type="number" id="num2" placeholder="नंबर 2">
    <button onclick="calculate()">बराबर</button>

    <div id="result">उत्तर: -</div>
    
    <div class="abacus" id="abacusDisplay"></div>

    <script>
        function calculate() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const op = document.getElementById('operator').value;
            let ans = 0;

            if (isNaN(n1) || isNaN(n2)) {
                alert("कृपया दोनों बॉक्स में सही नंबर लिखें");
                return;
            }

            if (op === '+') ans = n1 + n2;
            else if (op === '-') ans = n1 - n2;
            else if (op === '*') ans = n1 * n2;
            else if (op === '/') ans = n2 !== 0 ? n1 / n2 : "Error";

            if (ans === "Error" || ans < 0) {
                document.getElementById('result').innerText = "अवैध उत्तर (केवल पॉजिटिव नंबर)";
                document.getElementById('abacusDisplay').innerHTML = "";
                return;
            }

            // दशमलव हटाकर पूर्णांक ले रहे हैं अबैकस डिस्प्ले के लिए
            let finalAns = Math.round(ans); 
            document.getElementById('result').innerText = "उत्तर: " + ans;

            drawAbacus(finalAns);
        }

        function drawAbacus(number) {
            const container = document.getElementById('abacusDisplay');
            container.innerHTML = ""; // पुराना अबैकस साफ़ करें
            
            let numStr = number.toString();
            
            // हर डिजिट के लिए एक रॉड (तार) बनाएँ
            for (let i = 0; i < numStr.length; i++) {
                let digit = parseInt(numStr[i]);
                
                let rod = document.createElement('div');
                rod.className = 'rod';
                
                let beam = document.createElement('div');
                beam.className = 'beam';
                rod.appendChild(beam);

                // ऊपरी मोती (Value = 5)
                let upperContainer = document.createElement('div');
                upperContainer.className = 'upper';
                let upperBead = document.createElement('div');
                upperBead.className = 'bead';
                if (digit >= 5) {
                    upperBead.style.transform = 'translateY(25px)'; // नीचे बीम की तरफ
                }
                upperContainer.appendChild(upperBead);
                rod.appendChild(upperContainer);

                // निचले 4 मोती (Value = 1 ईच)
                let lowerContainer = document.createElement('div');
                lowerContainer.className = 'lower';
                let activeLowerBeads = digit % 5;
                
                for (let b = 0; b < 4; b++) {
                    let lowerBead = document.createElement('div');
                    lowerBead.className = 'bead';
                    if (b < activeLowerBeads) {
                        lowerBead.style.transform = 'translateY(-65px)'; // ऊपर बीम की तरफ
                    }
                    lowerContainer.appendChild(lowerBead);
                }
                rod.appendChild(lowerContainer);
                container.appendChild(rod);
            }
        }
    </script>
</body>
</html>
