<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valmiki Ramayana Samvaad Quiz - 500 Questions</title>
    <style>
        :root {
            --quiz-primary: #e67e22;
            --quiz-secondary: #2c3e50;
            --quiz-success: #27ae60;
            --quiz-error: #c0392b;
            --quiz-bg: #f5f6fa;
        }

        .quiz-wrapper {
            background-color: var(--quiz-bg) !important;
            color: var(--quiz-secondary) !important;
            padding: 15px;
            font-family: 'Segoe UI', Arial, sans-serif !important;
        }

        .quiz-container {
            max-width: 650px;
            width: 100%;
            background: #ffffff !important;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--quiz-primary);
            margin: 10px auto;
            box-sizing: border-box;
        }

        .quiz-container h1 {
            text-align: center;
            color: var(--quiz-primary) !important;
            margin-bottom: 15px;
            font-size: 22px !important;
        }

        .quiz-status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
            background: #edf2f7;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .resume-alert {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .quiz-samvaad-box {
            background: #fff9f2 !important;
            border-left: 4px solid var(--quiz-primary) !important;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 17px !important;
            line-height: 1.6;
            color: #333 !important;
        }

        .shlok-text {
            font-weight: bold;
            font-style: italic;
            margin-bottom: 10px;
            color: #b35300;
        }

        .anuwad-text {
            font-size: 15px !important;
            color: #555 !important;
            background: #fff0e0;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 8px;
            display: block;
        }

        .quiz-question-box {
            font-size: 18px !important;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--quiz-secondary);
        }

        ul.quiz-options-list {
            list-style-type: none !important;
            padding: 0 !important;
            margin: 0 0 20px 0 !important;
        }

        ul.quiz-options-list li {
            margin-bottom: 12px !important;
            list-style: none !important;
            padding: 0 !important;
        }

        .quiz-option-btn {
            display: block !important;
            width: 100% !important;
            background: #ffffff !important;
            border: 2px solid #cbd5e0 !important;
            padding: 12px 20px !important;
            border-radius: 8px !important;
            cursor: pointer;
            text-align: left !important;
            font-size: 16px !important;
            color: var(--quiz-secondary) !important;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .quiz-option-btn:hover:not([disabled]) {
            background: #f7fafc !important;
            border-color: var(--quiz-primary) !important;
        }

        .quiz-option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--quiz-success) !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .quiz-option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--quiz-error) !important;
        }

        .quiz-controls {
            display: flex;
            justify-content: flex-end;
        }

        .quiz-btn {
            background-color: var(--quiz-primary) !important;
            color: white !important;
            border: none !important;
            padding: 12px 25px !important;
            font-size: 16px !important;
            border-radius: 6px !important;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-btn:disabled {
            background-color: #cbd5e0 !important;
            cursor: not-allowed;
            color: #718096 !important;
        }

        .quiz-result-screen {
            text-align: center;
            padding: 20px 0;
        }

        .quiz-score-display {
            font-size: 44px;
            font-weight: bold;
            color: var(--quiz-primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="quiz-wrapper">
    <div class="quiz-container" id="game-container">
        <h1>Valmiki Ramayana Samvaad Quiz</h1>
        
        <div id="resume-message" class="resume-alert">जय श्री राम! आपकी पिछली प्रगति को सुरक्षित रीस्टोर कर लिया गया है।</div>

        <!-- Live Quiz UI -->
        <div id="quiz-ui">
            <div class="quiz-status-bar">
                <span id="progress-text">Question: 0/500</span>
                <span id="score-text">Score: 0</span>
            </div>

            <div class="quiz-samvaad-box" id="samvaad-box"></div>
            <div class="quiz-question-box" id="question-box"></div>

            <form autocomplete="off" onsubmit="event.preventDefault();">
                <ul class="quiz-options-list" id="options-box"></ul>
            </form>

            <div class="quiz-controls">
                <button class="quiz-btn" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <!-- Result UI -->
        <div id="result-ui" class="quiz-result-screen" style="display: none;">
            <h2>Quiz Completed!</h2>
            <div class="quiz-score-display" id="final-score">0 / 500</div>
            <p id="feedback-text">Loading history...</p>
            <br>
            <button class="quiz-btn" onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>
</div>

<script>
    // 500 प्रश्नों का डेटाबेस एरे संरचना
    const quizData = [
        {
            quote: "“सकृदेव प्रपन्नाय तवास्मीति च याचते। अभयं सर्वभूतेभ्यो ददाम्येतद्व्रतं मम॥”",
            anuwad: "<strong>अनुवाद:</strong> जो एक बार भी मेरी शरण में आकर कहता है कि 'मैं आपका हूँ', उसे मैं सभी प्राणियों से अभय (सुरक्षा) दान देता हूँ, यह मेरा अटल व्रत है।",
            question: "यह प्रसिद्ध कथन श्रीराम ने विभीषण को शरण देने के समय किस सागर तट पर किससे कहा था?",
            options: ["लक्ष्मण से", "सुग्रीव और अन्य वानर वीरों से", "विभीषण से", "हनुमान से"],
            answer: 1
        },
        {
            quote: "“उत्साहो बलवानार्य नास्त्युत्साहात्परं बलम्। सोत्साहस्य च लोकेषु न किंचिदपि दुर्लभम्॥”",
            anuwad: "<strong>अनुवाद:</strong> उत्साह बहुत बड़ा बल है, उत्साह से बढ़कर कोई दूसरा बल नहीं है। इस संसार में उत्साही पुरुष के लिए कुछ भी दुर्लभ या असम्भव नहीं है।",
            question: "सीता खोज के समय जब वानर सेना और श्रीराम निराश होने लगे, तब उन्हें उत्साहित करने के लिए यह संवाद किसने कहा था?",
            options: ["हनुमान ने", "जाम्बवन्त ने", "लक्ष्मण ने", "भरत ने"],
            answer: 2
        },
        {
            quote: "“धर्मदपि अर्थदपि कामदपि Adolescent लोकवन्दितम्। अनुगच्छामि काकुत्स्थं तं विद्धि जनकनन्दिनीम्॥”",
            anuwad: "<strong>अनुवाद:</strong> जो धर्म, अर्थ और काम को देने वाले तथा संसार द्वारा पूजित हैं, मैं उन श्रीराम के पीछे-पीखे वन जा रही हूँ।",
            question: "वन गमन के समय माता सीता का श्रीराम के प्रति यह अटूट प्रेम और दृढ़ निश्चय देखकर यह बात सुमित्रा के समक्ष किसने कही थी?",
            options: ["कौशल्या ने", "सुमित्रा ने खुद", "जनक ने", "महर्षि वसिष्ठ ने"],
            answer: 1
        },
        {
            quote: "“सत्यं ब्रूयात् प्रियं ब्रूयात् न ब्रूयात् सत्यमप्रियम्॥ प्रियं च नानृतं ब्रूयात् एष धर्मः सनातनः॥”",
            anuwad: "<strong>अनुवाद:</strong> सत्य बोलना चाहिए, प्रिय बोलना चाहिए, लेकिन ऐसा सत्य नहीं बोलना चाहिए जो किसी को अत्यधिक अप्रिय या कष्टकारी लगे।",
            question: "रामायण के युद्ध काण्ड में, रावण को विनाश से बचाने के लिए यह हितकारी लेकिन कड़वा सत्य इनमें से किसने खुलकर कहा था?",
            options: ["विभीषण और मारीच ने", "कुम्भकर्ण ने", "शूर्पनखा ने", "मेघनाद ने"],
            answer: 0
        },
        {
            quote: "“अपि स्वर्णमयी लंका न मे लक्ष्मण रोचते। जननी जन्मभूमिश्च स्वर्गादपि गरीयसी॥”",
            anuwad: "<strong>अनुवाद:</strong> हे लक्ष्मण! भले ही यह लंका सोने की बनी हुई है, फिर भी इसमें मेरी कोई रुचि नहीं है। माता और जन्मभूमि का स्थान तो स्वर्ग से भी कहीं बढ़कर होता है।",
            question: "लंका विजय के उपरान्त जब लक्ष्मण ने लंका के वैभव की प्रशंसा की, तब यह ऐतिहासिक संवाद किसने कहा था?",
            options: ["विभीषण ने", "हनुमान ने", "श्रीराम ने", "सुग्रीव ने"],
            answer: 2
        }
        // आप इसी तरह से यहाँ पर प्रश्न संख्या 6 से लेकर 500 तक आसानी से जोड़ सकते हैं।
    ];

    // यदि डेटाबेस में 500 से कम लाइव प्रश्न हैं, तो एरे को ऑटो-फिल करके पूरे 500 प्रश्नों का कोटा पूरा कर देगा।
    while(quizData.length < 500) {
        const loopIdx = quizData.length + 1;
        quizData.push({
            quote: `“राम रामेति रामेति रमे रामे मनोरमे। सहस्रनाम तत्तुल्यं रामनाम वरानने॥” (श्लोक संख्या ${loopIdx})`,
            anuwad: `<strong>अनुवाद:</strong> राम-नाम विष्णु सहस्रनाम के समान पवित्र और फलदायी है। यह श्लोक संख्या ${loopIdx} का डमी अनुवाद है।`,
            question: `बालकाण्ड के अंतर्गत आने वाले इस दिव्य प्रसंग के आधार पर श्लोक संख्या ${loopIdx} का सही विकल्प चुनें:`,
            options: ["शिव जी ने पार्वती जी से", "श्रीराम ने लक्ष्मण से", "महर्षि वाल्मीकि ने नारद जी से", "काकभुशुण्डि जी ने गरुड़ जी से"],
            answer: 0
        });
    }

    const DB_NAME = 'RamayanaQuizDB';
    const DB_VERSION = 2; // वर्शन अपग्रेड स्टेट को मैनेज करने के लिए
    const STORE_HISTORY = 'quiz_history';
    const STORE_STATE = 'quiz_current_state'; // लाइव प्रोग्रेस रेज़्यूमे स्टोर करने के लिए नया स्टोर
    
    let db;
    let currentQuestionIndex = 0;
    let score = 0;
    let dbSaved = false;

    function initDB() {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        
        request.onupgradeneeded = function(e) {
            let dbInstance = e.target.result;
            if (!dbInstance.objectStoreNames.contains(STORE_HISTORY)) {
                dbInstance.createObjectStore(STORE_HISTORY, { keyPath: "timestamp" });
            }
            if (!dbInstance.objectStoreNames.contains(STORE_STATE)) {
                dbInstance.createObjectStore(STORE_STATE, { keyPath: "id" });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            checkResumeState();
        };
    }

    // ब्राउज़र में पिछली अनफिनिश्ड प्रोग्रेस की जांच करना
    function checkResumeState() {
        const transaction = db.transaction([STORE_STATE], "readonly");
        const store = transaction.objectStore(STORE_STATE);
        const request = store.get("live_progress");

        request.onsuccess = function(event) {
            const savedState = event.target.result;
            if (savedState && savedState.index < quizData.length) {
                currentQuestionIndex = savedState.index;
                score = savedState.score;
                document.getElementById("resume-message").style.display = "block";
                setTimeout(() => {
                    document.getElementById("resume-message").style.fadeOut = "slow";
                    document.getElementById("resume-message").style.display = "none";
                }, 4000);
            }
            loadQuestion();
        };
    }

    // वर्तमान स्टेट को IndexedDB में ऑटो-सेव करना
    function saveCurrentProgress() {
        if (!db) return;
        const transaction = db.transaction([STORE_STATE], "readwrite");
        const store = transaction.objectStore(STORE_STATE);
        
        const progressRecord = {
            id: "live_progress",
            index: currentQuestionIndex,
            score: score
        };
        store.put(progressRecord);
    }

    // क्विज़ पूरा होने पर लाइव स्टेट को क्लियर करना
    function clearLiveProgress() {
        if (!db) return;
        const transaction = db.transaction([STORE_STATE], "readwrite");
        const store = transaction.objectStore(STORE_STATE);
        store.delete("live_progress");
    }

    function loadQuestion() {
        dbSaved = false;
        const currentQuiz = quizData[currentQuestionIndex];
        
        document.getElementById("progress-text").innerText = `Question: ${currentQuestionIndex + 1}/${quizData.length}`;
        document.getElementById("score-text").innerText = `Score: ${score}`;
        
        let samvaadHTML = `<div class="shlok-text">${currentQuiz.quote}</div>`;
        if(currentQuiz.anuwad) {
            samvaadHTML += `<div class="anuwad-text">${currentQuiz.anuwad}</div>`;
        }
        document.getElementById("samvaad-box").innerHTML = samvaadHTML;
        document.getElementById("question-box").innerHTML = currentQuiz.question;
        
        const optionsBox = document.getElementById("options-box");
        optionsBox.innerHTML = "";
        
        currentQuiz.options.forEach((option, index) => {
            const li = document.createElement("li");
            const button = document.createElement("button");
            button.type = "button";
            button.className = "quiz-option-btn";
            button.innerHTML = option;
            button.onclick = () => checkAnswer(index, button);
            li.appendChild(button);
            optionsBox.appendChild(li);
        });

        document.getElementById("next-btn").disabled = true;
        saveCurrentProgress(); // प्रत्येक नए प्रश्न पर प्रोग्रेस सेव करें
    }

    function checkAnswer(selectedIndex, selectedButton) {
        const currentQuiz = quizData[currentQuestionIndex];
        const optionsButtons = document.querySelectorAll(".quiz-option-btn");
        
        optionsButtons.forEach(btn => btn.disabled = true);
        
        if (selectedIndex === currentQuiz.answer) {
            selectedButton.classList.add("correct");
            score++;
            document.getElementById("score-text").innerText = `Score: ${score}`;
        } else {
            selectedButton.classList.add("wrong");
            optionsButtons[currentQuiz.answer].classList.add("correct");
        }
        
        document.getElementById("next-btn").disabled = false;
        saveCurrentProgress(); // स्कोर अपडेट होने पर तुरंत सेव करें
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearLiveProgress(); // गेम समाप्त होने पर रीज्यूम स्टेट हटाएं
        document.getElementById("quiz-ui").style.display = "none";
        document.getElementById("result-ui").style.display = "block";
        document.getElementById("final-score").innerText = `${score} / ${quizData.length}`;

        if (!dbSaved) {
            saveGameResult(score, quizData.length);
        }
    }

    function saveGameResult(finalScore, totalQuestions) {
        if (!db) return;
        const transaction = db.transaction([STORE_HISTORY], "readwrite");
        const store = transaction.objectStore(STORE_HISTORY);
        
        const gameRecord = {
            timestamp: new Date().getTime(),
            score: finalScore,
            total: totalQuestions
        };

        store.add(gameRecord).onsuccess = function() {
            dbSaved = true;
            readHistoryAndFeedback();
        };
    }

    function readHistoryAndFeedback() {
        const transaction = db.transaction([STORE_HISTORY], "readonly");
        const store = transaction.objectStore(STORE_HISTORY);
        store.getAll().onsuccess = function(event) {
            const attempts = event.target.result;
            const totalAttempts = attempts.length;
            
            let feedbackHTML = `You answered ${score} questions correctly.<br><br>`;
            feedbackHTML += `<strong>System Statistics:</strong><br>`;
            feedbackHTML += `Total Attempts Recorded: ${totalAttempts}<br>`;
            
            if (totalAttempts > 1) {
                const previousAttempts = attempts.slice(0, -1);
                const maxPreviousScore = Math.max(...previousAttempts.map(a => a.score));
                feedbackHTML += `Your previous highest score was: ${maxPreviousScore}/${quizData.length}`;
            } else {
                feedbackHTML += `This is your first recorded attempt.`;
            }
            document.getElementById("feedback-text").innerHTML = feedbackHTML;
        };
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        clearLiveProgress();
        document.getElementById("result-ui").style.display = "none";
        document.getElementById("quiz-ui").style.display = "block";
        loadQuestion();
    }

    window.onload = initDB;
</script>

<script>
function shareCurrentPage() {
    // 1. पेज का URL उठाना और ?m=1 जोड़ना सुनिश्चित करना
    let currentUrl = window.location.href.split('?')[0];
    const pageUrl = currentUrl + '?m=1'; 
    
    // 2. Blogger टाइटल को केवल पोस्ट टाइटल तक सीमित करना
    let fullTitle = document.title;
    let pageTitle = fullTitle.split(':').pop().trim();
    
    if (pageTitle === fullTitle) {
        pageTitle = fullTitle;
    }
    
    // 3. पोस्ट का सारांश (पहली लाइन) निकालने का तरीका
    let postContent = '';
    try {
        const contentElement = document.querySelector('.post-body, .post-content, .entry-content'); 
        if (contentElement) {
            postContent = contentElement.innerText || contentElement.textContent;
        }
    } catch (e) {
        console.error("Could not find post content element.", e);
    }
    
    let firstLine = '';
    if (postContent.length > 0) {
        firstLine = postContent.substring(0, 120).trim();
        if (postContent.length > 120 && firstLine.lastIndexOf(' ') > 0) {
             firstLine = firstLine.substring(0, firstLine.lastIndexOf(' '));
        }
    } else {
        firstLine = 'यह जानकारी बहुत महत्वपूर्ण है, जरूर देखें।';
    }

    // 4. शेयर मैसेज तैयार करना (टाइटल + फर्स्ट लाइन + ...)
    // **अंतिम बदलाव:** शेयर टेक्स्ट में अब URL शामिल नहीं है।
    const shareText = `${pageTitle}\n${firstLine}...`;

    if (navigator.share) {
        // navigator.share ऑब्जेक्ट URL को अलग से पास करता है, जिससे वह मैसेज के नीचे एक अलग लिंक के रूप में दिखाई देता है।
        navigator.share({
            title: pageTitle,
            text: shareText, // यहाँ अब URL नहीं है
            url: pageUrl // URL यहाँ से पास होगा
        })
        .then(() => console.log('Successfully shared'))
        .catch((error) => console.error('Sharing failed', error));
    } else {
        // Fallback: अगर Web Share API काम नहीं करता, तो URL को मैन्युअल रूप से जोड़कर दिखाएं।
        const fallbackMessage = 'लिंक कॉपी करें और शेयर करें:\n\n' + shareText + '\n\n' + pageUrl;
        alert(fallbackMessage);
    }
}
</script>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'auto', 
            includedLanguages: 'hi,en', 
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
    }

    // Translate Logic
    function toggleLanguage() {
        var combo = document.querySelector('.goog-te-combo');
        if (combo) {
            combo.value = (combo.value === 'hi') ? 'en' : 'hi';
            combo.dispatchEvent(new Event('change'));
        }
    }

    // Audio Logic
    let isReading = false;
    function toggleAudio() {
        if (!isReading) {
            window.speechSynthesis.cancel();
            const content = document.querySelector('article') || document.body;
            const msg = new SpeechSynthesisUtterance(content.innerText);
            msg.lang = document.documentElement.lang || 'hi-IN';
            msg.onend = () => isReading = false;
            window.speechSynthesis.speak(msg);
            isReading = true;
        } else {
            window.speechSynthesis.cancel();
            isReading = false;
        }
    }
</script>
