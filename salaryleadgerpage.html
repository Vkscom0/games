<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Page Tracker (Salary, Ledger, Estimate)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { 
            max-width: 500px; 
            margin: 20px auto; 
            padding: 25px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        
        /* Page Selector & Control Bar Styling */
        .page-control-box {
            background-color: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #d0d7de;
        }
        .page-select-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        select {
            flex-grow: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 15px;
            font-weight: bold;
        }
        .btn-sm {
            width: auto;
            padding: 8px 12px;
            margin-bottom: 0;
            font-size: 13px;
        }

        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
        }
        textarea { height: 80px; resize: vertical; font-family: monospace; }
        
        button { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 8px; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 15px;
            transition: background-color 0.3s;
        }
        #submitButton { background-color: #007bff; }
        #submitButton:hover { background-color: #0056b3; }
        #restoreButton { background-color: #6c757d; }
        #restoreButton:hover { background-color: #5a6268; }
        #clearButton { background-color: #dc3545; }
        #clearButton:hover { background-color: #c82333; }
        #exportButton { background-color: #28a745; }
        #exportButton:hover { background-color: #1e7e34; }
        #processPasteButton { background-color: #ffc107; color: #343a40; }
        #processPasteButton:hover { background-color: #e0a800; }
        
        .btn-add { background-color: #17a2b8; }
        .btn-rename { background-color: #ffc107; color: #000; }
        .btn-delete { background-color: #dc3545; }

        .total-display { 
            font-size: 1.4em; 
            font-weight: bold; 
            margin-top: 15px; 
            padding: 12px; 
            background-color: #e2f0fb; 
            border-left: 5px solid #007bff; 
            border-radius: 4px; 
            text-align: center;
        }
        #message { margin-top: 10px; text-align: center; font-weight: bold; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #eee; }
        
        #recordsTable { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        #recordsTable th, #recordsTable td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: right;
            color: black !important;
        }
        #recordsTable th { 
            background-color: #f2f2f2; 
            text-align: left;
            color: black !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="pageHeading">📄 Multi-Page Tracker</h2>

        <!-- Page Management Section -->
        <div class="page-control-box">
            <label for="pageSelect">📖 Active Page Select Karein:</label>
            <div class="page-select-group">
                <select id="pageSelect"></select>
                <button class="btn-sm btn-add" id="addPageBtn">+ New</button>
            </div>
            <div class="page-select-group" style="margin-top: 8px;">
                <button class="btn-sm btn-rename" id="renamePageBtn">✏️ Rename Page</button>
                <button class="btn-sm btn-delete" id="deletePageBtn">🗑️ Delete Page</button>
            </div>
        </div>

        <label for="presentSalary">1. Present / Main Amount:</label>
        <input id="presentSalary" placeholder="रकम दर्ज करें" type="number" />

        <label for="overtimeSalary">2. Overtime / Extra Amount:</label>
        <input id="overtimeSalary" placeholder="अतिरिक्त रकम दर्ज करें" type="number" />

        <button id="submitButton">Submit &amp; Save New Entry</button>
        <button id="restoreButton">Restore Last Entry to Input</button> 
        
        <div class="total-display" id="totalAmount">
            Cumulative Total: 0.00
        </div>
        
        <h3>📊 Page Records</h3>
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Main Amount</th>
                    <th>Extra Amount</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
        </table>
        
        <hr />
        
        <h3>⚙️ Data Management</h3>
        <button id="clearButton">Clear Active Page Data</button>
        <button id="exportButton">Export Active Page Data (CSV)</button>

        <label for="importTextarea">Paste CSV Data from Google Sheets:</label>
        <textarea id="importTextarea" placeholder="Example:
01/01/2026, 15000.00, 2000.00, 17000.00"></textarea>
        <button id="processPasteButton">Process Pasted Data</button>
        <p id="message"></p>
    </div>

    <script>
        const STORAGE_KEY_PAGES = 'app_pages_list';
        const STORAGE_KEY_CURRENT = 'app_current_page';
        
        // Default pages
        const DEFAULT_PAGES = ["Salary Tracker", "Ledgerlist", "Estimate Slip"];

        document.addEventListener('DOMContentLoaded', () => {
            initPageStorage();
            
            // Event Listeners for Page Controls
            document.getElementById('pageSelect').addEventListener('change', changePage);
            document.getElementById('addPageBtn').addEventListener('click', addPage);
            document.getElementById('renamePageBtn').addEventListener('click', renamePage);
            document.getElementById('deletePageBtn').addEventListener('click', deletePage);

            // Data Operations
            document.getElementById('submitButton').addEventListener('click', saveNewEntry);
            document.getElementById('restoreButton').addEventListener('click', loadLatestEntryToInput); 
            document.getElementById('clearButton').addEventListener('click', clearPageData);
            document.getElementById('exportButton').addEventListener('click', exportCSV);
            document.getElementById('processPasteButton').addEventListener('click', importPastedData); 
            
            renderPageDropdown();
            renderRecords();
        });

        // --- PAGE MANAGEMENT FUNCTIONS ---

        function initPageStorage() {
            let pages = getPageList();
            if (pages.length === 0) {
                localStorage.setItem(STORAGE_KEY_PAGES, JSON.stringify(DEFAULT_PAGES));
                localStorage.setItem(STORAGE_KEY_CURRENT, DEFAULT_PAGES[0]);
            }
        }

        function getPageList() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY_PAGES)) || [];
            } catch (e) {
                return [];
            }
        }

        function getCurrentPage() {
            return localStorage.getItem(STORAGE_KEY_CURRENT) || DEFAULT_PAGES[0];
        }

        function getActiveDataKey() {
            return 'page_data_' + getCurrentPage();
        }

        function renderPageDropdown() {
            const pages = getPageList();
            const current = getCurrentPage();
            const select = document.getElementById('pageSelect');
            
            select.innerHTML = '';
            pages.forEach(page => {
                const opt = document.createElement('option');
                opt.value = page;
                opt.textContent = page;
                if (page === current) opt.selected = true;
                select.appendChild(opt);
            });

            document.getElementById('pageHeading').textContent = `📄 ${current}`;
        }

        function changePage() {
            const select = document.getElementById('pageSelect');
            localStorage.setItem(STORAGE_KEY_CURRENT, select.value);
            document.getElementById('pageHeading').textContent = `📄 ${select.value}`;
            renderRecords();
            showMessage(`Switched to page: ${select.value}`, 'blue');
        }

        function addPage() {
            const newName = prompt("Naye Page ka Naam Likhein:");
            if (!newName || !newName.trim()) return;

            const trimmedName = newName.trim();
            let pages = getPageList();

            if (pages.includes(trimmedName)) {
                showMessage("❌ Is naam ka page pehle se exist karta hai!", 'red');
                return;
            }

            pages.push(trimmedName);
            localStorage.setItem(STORAGE_KEY_PAGES, JSON.stringify(pages));
            localStorage.setItem(STORAGE_KEY_CURRENT, trimmedName);
            
            renderPageDropdown();
            renderRecords();
            showMessage(`✅ Naya Page "${trimmedName}" Ban Gaya!`, 'green');
        }

        function renamePage() {
            const current = getCurrentPage();
            const newName = prompt(`"${current}" ka Naya Naam Likhein:`, current);
            if (!newName || !newName.trim() || newName.trim() === current) return;

            const trimmedName = newName.trim();
            let pages = getPageList();

            if (pages.includes(trimmedName)) {
                showMessage("❌ Is naam ka page pehle se exist karta hai!", 'red');
                return;
            }

            // Move Data to new key
            const oldDataKey = getActiveDataKey();
            const pageData = localStorage.getItem(oldDataKey);
            
            if (pageData !== null) {
                localStorage.setItem('page_data_' + trimmedName, pageData);
                localStorage.removeItem(oldDataKey);
            }

            // Update Page list
            const index = pages.indexOf(current);
            if (index !== -1) pages[index] = trimmedName;

            localStorage.setItem(STORAGE_KEY_PAGES, JSON.stringify(pages));
            localStorage.setItem(STORAGE_KEY_CURRENT, trimmedName);

            renderPageDropdown();
            renderRecords();
            showMessage(`✏️ Page Rename Hokar "${trimmedName}" Ho Gaya!`, 'green');
        }

        function deletePage() {
            let pages = getPageList();
            if (pages.length <= 1) {
                showMessage("❌ Kam se kam ek Page hona zaroori hai!", 'red');
                return;
            }

            const current = getCurrentPage();
            if (confirm(`⚠️ Kya aap Page "${current}" aur iska SAARA Data delete karna chahte hain?`)) {
                // Remove Data
                localStorage.removeItem(getActiveDataKey());

                // Remove Page entry
                pages = pages.filter(p => p !== current);
                localStorage.setItem(STORAGE_KEY_PAGES, JSON.stringify(pages));
                localStorage.setItem(STORAGE_KEY_CURRENT, pages[0]);

                renderPageDropdown();
                renderRecords();
                showMessage(`🗑️ Page "${current}" Deleted!`, 'red');
            }
        }

        // --- DATA ENTRIES & STORAGE FUNCTIONS ---

        function getEntries() {
            const data = localStorage.getItem(getActiveDataKey());
            try {
                return JSON.parse(data) || [];
            } catch (e) {
                return [];
            }
        }

        function setEntries(entries) {
            localStorage.setItem(getActiveDataKey(), JSON.stringify(entries));
            renderRecords(); 
        }

        function saveNewEntry() {
            const present = parseFloat(document.getElementById('presentSalary').value) || 0;
            const overtime = parseFloat(document.getElementById('overtimeSalary').value) || 0;

            if (present <= 0 && overtime <= 0) {
                showMessage("❌ Kripya Amount enter karein!", 'red');
                return;
            }

            const newEntry = {
                date: new Date().toLocaleDateString('en-IN'), 
                present: present.toFixed(2),
                overtime: overtime.toFixed(2),
                total: (present + overtime).toFixed(2)
            };
            
            const entries = getEntries();
            entries.push(newEntry);
            setEntries(entries);
            
            document.getElementById('presentSalary').value = '';
            document.getElementById('overtimeSalary').value = '';

            showMessage("✅ New entry successfully saved!", 'green');
        }

        function loadLatestEntryToInput() {
            const entries = getEntries();
            if (entries.length === 0) {
                showMessage("❌ Is Page par koi record nahi hai!", 'red');
                return;
            }
            
            const latestEntry = entries[entries.length - 1];
            document.getElementById('presentSalary').value = latestEntry.present;
            document.getElementById('overtimeSalary').value = latestEntry.overtime;

            showMessage("↩️ Last entry restored to input fields.", 'blue');
        }

        function renderRecords() {
            const entries = getEntries();
            const body = document.getElementById('recordsBody');
            body.innerHTML = ''; 
            
            let cumulativeTotal = 0;

            if (entries.length === 0) {
                body.innerHTML = '<tr><td colspan="4" style="text-align: center;">No records found for this page.</td></tr>';
            } else {
                entries.forEach((entry) => {
                    const row = body.insertRow();
                    row.insertCell(0).textContent = entry.date;
                    row.insertCell(1).textContent = parseFloat(entry.present).toFixed(2);
                    row.insertCell(2).textContent = parseFloat(entry.overtime).toFixed(2);
                    row.insertCell(3).textContent = parseFloat(entry.total).toFixed(2);
                    cumulativeTotal += parseFloat(entry.total);
                });
            }

            document.getElementById('totalAmount').textContent = `Cumulative Total: ${cumulativeTotal.toFixed(2)}`;
        }

        function clearPageData() {
            const current = getCurrentPage();
            if (confirm(`⚠️ Kya aap Page "${current}" ka saara data clear karna chahte hain?`)) {
                localStorage.removeItem(getActiveDataKey());
                renderRecords(); 
                showMessage(`🗑️ "${current}" Data Cleared!`, 'red');
            }
        }

        function exportCSV() {
            const entries = getEntries();
            const current = getCurrentPage();

            if (entries.length === 0) {
                showMessage("❌ Export failed. No records to export.", 'red');
                return;
            }
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Date,Main Amount,Extra Amount,Total\r\n";
            
            entries.forEach(entry => {
                csvContent += `${entry.date},${entry.present},${entry.overtime},${entry.total}\r\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${current.replace(/\s+/g, '_')}_records_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showMessage(`📤 Data exported for "${current}"!`, 'green');
        }

        function importPastedData() {
            const csvText = document.getElementById('importTextarea').value;
            if (!csvText.trim()) {
                showMessage("❌ Textarea khali hai. Data paste karein.", 'red');
                return;
            }

            try {
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                const firstLine = lines[0].trim().toLowerCase();
                const startIndex = (firstLine.includes('date') || firstLine.includes('amount')) ? 1 : 0;
                
                const importedEntries = [];

                for (let i = startIndex; i < lines.length; i++) {
                    let values = lines[i].split(',');
                    if (values.length < 3) {
                       values = lines[i].split('\t');
                    }

                    if (values.length >= 2) {
                        const date = values[0].trim();
                        const present = parseFloat(values[1].trim().replace(/[^0-9.]/g, '') || '0');
                        const overtime = parseFloat((values[2] || '0').trim().replace(/[^0-9.]/g, '') || '0');

                        if (!isNaN(present) && !isNaN(overtime)) {
                            importedEntries.push({
                                date: date,
                                present: present.toFixed(2),
                                overtime: overtime.toFixed(2),
                                total: (present + overtime).toFixed(2)
                            });
                        }
                    }
                }

                if (importedEntries.length > 0) {
                    setEntries(importedEntries); 
                    document.getElementById('importTextarea').value = '';
                    showMessage(`📥 ${importedEntries.length} records imported!`, 'green');
                } else {
                    showMessage("❌ Invalid data format.", 'red');
                }

            } catch (error) {
                showMessage("❌ Error processing data.", 'red');
            }
        }

        function showMessage(msg, color) {
            const msgElement = document.getElementById('message');
            msgElement.textContent = msg;
            msgElement.style.color = color;
            setTimeout(() => {
                msgElement.textContent = '';
                msgElement.style.color = '';
            }, 4000);
        }
    </script>
</body>
</html>
