<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Referral System with Authentication</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1000px; margin: 0 auto; }
    .auth-container { max-width: 400px; margin: 50px auto; }

    h1, h2 { margin-bottom: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 14px; }
    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 14px;
    }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; color: #fff;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); width: 100%; }
    .btn-action { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #475569; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); word-break: break-all; }
    th { color: var(--muted); font-size: 13px; text-transform: uppercase; }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-blocked { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .hidden { display: none !important; }
    .redirect-msg { text-align: center; padding: 50px 20px; }
    .loader { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 10px; text-align: center; }
    .auth-toggle { text-align: center; margin-top: 15px; color: var(--muted); font-size: 14px; }
    .auth-toggle span { color: var(--primary); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">

  <!-- Redirect Screen (Direct Access via Hash) -->
  <div id="redirect-screen" class="card redirect-msg hidden">
    <h2 id="redirect-status">Verifying Link...</h2>
    <p id="redirect-detail" style="color: var(--muted);"></p>
  </div>

  <!-- AUTH SECTION (Login / Signup) -->
  <div id="auth-screen" class="auth-container hidden">
    
    <!-- Login Form -->
    <div id="login-box" class="card">
      <h2>Admin Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <div class="auth-toggle">
        Account nahi hai? <span onclick="switchAuth('signup')">Signup karein</span>
      </div>
    </div>

    <!-- Signup Form -->
    <div id="signup-box" class="card hidden">
      <h2>Naya Account Banayein</h2>
      <form id="signup-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signup-username" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" required />
        </div>
        <button type="submit" class="btn-primary" style="background: var(--success);">Signup</button>
      </form>
      <div class="auth-toggle">
        Pehle se account hai? <span onclick="switchAuth('login')">Login karein</span>
      </div>
    </div>

  </div>

  <!-- MAIN MANAGEMENT DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="header-bar">
      <h1>Referral Manager</h1>
      <div>
        <span id="user-display" style="margin-right: 15px; color: var(--muted);"></span>
        <button class="btn-danger" onclick="logout()" style="padding: 6px 12px;">Logout</button>
      </div>
    </div>

    <!-- Create Referral Form -->
    <div class="card">
      <h2>Naya Referral Link Banayein</h2>
      <form id="referral-form">
        <div class="form-group">
          <label for="target-url">Target URL (Jahan Redirect Karna Hai)</label>
          <input type="url" id="target-url" placeholder="https://example.com/page" required />
        </div>
        <div class="form-group">
          <label for="custom-code">Custom Hash Code (Optional)</label>
          <input type="text" id="custom-code" placeholder="e.g. promo2026" />
        </div>
        <button type="submit" class="btn-action">Generate Referral Link</button>
      </form>
    </div>

    <!-- Data Controls -->
    <div class="card">
      <h2>Backup & Tools</h2>
      <div class="btn-group">
        <button id="export-btn" class="btn-secondary">Export JSON</button>
        <button id="import-trigger-btn" class="btn-secondary">Import JSON</button>
        <input type="file" id="import-file" accept=".json" class="hidden" />
        <button id="refresh-btn" class="btn-secondary">Refresh Table</button>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <h2>Manage Links</h2>
      <div id="loading-indicator" class="loader hidden">Syncing with Google Sheet...</div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Target URL</th>
              <th>Clicks</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="referral-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  // 🔴 PASTE YOUR GOOGLE SCRIPT WEB APP URL HERE
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZCWHNoe8lnhme3l326xG689ijdnoUu8VWqIn-kHGaWs991IqyFUeXvIfuB_fmUn7ueQ/exec';

  // --- AUTH SWITCHING ---
  function switchAuth(type) {
    if (type === 'signup') {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('signup-box').classList.remove('hidden');
    } else {
      document.getElementById('signup-box').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
    }
  }

  function checkSession() {
    const user = localStorage.getItem('ref_admin_user');
    if (user) {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('user-display').textContent = `User: ${user}`;
      renderTable();
    } else {
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
    }
  }

  function logout() {
    localStorage.removeItem('ref_admin_user');
    checkSession();
  }

  // --- API CALLS ---
  async function callAPI(payload) {
    showLoading(true);
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      return await response.json();
    } catch (e) {
      console.error(e);
      alert('Network / Server Error!');
      return { status: 'error' };
    } finally {
      showLoading(false);
    }
  }

  async function fetchReferrals() {
    showLoading(true);
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getAll`);
      return await res.json();
    } catch (e) {
      return [];
    } finally {
      showLoading(false);
    }
  }

  function showLoading(show) {
    const loader = document.getElementById('loading-indicator');
    if (loader) {
      if (show) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  }

  // --- LOGIN & SIGNUP HANDLERS ---
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('login-username').value.trim();
    const p = document.getElementById('login-password').value.trim();

    const res = await callAPI({ action: 'login', username: u, password: p });
    if (res.status === 'success') {
      localStorage.setItem('ref_admin_user', res.username);
      checkSession();
    } else {
      alert(res.message || 'Login failed!');
    }
  });

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('signup-username').value.trim();
    const p = document.getElementById('signup-password').value.trim();

    const res = await callAPI({ action: 'signup', username: u, password: p });
    alert(res.message);
    if (res.status === 'success') {
      switchAuth('login');
    }
  });

  // --- REDIRECTION LOGIC (Public Hash Access) ---
  async function handleHashAccess() {
    const hash = window.location.hash;
    let refCode = '';

    if (hash.startsWith('#ref=')) refCode = hash.replace('#ref=', '');
    else if (hash.startsWith('#') && hash.length > 1) refCode = hash.replace('#', '');

    if (!refCode) return false;

    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('dashboard').classList.add('hidden');
    
    const redirectScreen = document.getElementById('redirect-screen');
    const statusEl = document.getElementById('redirect-status');
    const detailEl = document.getElementById('redirect-detail');
    redirectScreen.classList.remove('hidden');

    const items = await fetchReferrals();
    const item = items.find(r => r.code === refCode);

    if (!item) {
      statusEl.textContent = "Invalid Referral Link!";
      statusEl.style.color = "var(--danger)";
      detailEl.textContent = "Yeh code database mein nahi mila.";
      return true;
    }

    if (item.isBlocked) {
      statusEl.textContent = "Link Blocked!";
      statusEl.style.color = "var(--danger)";
      detailEl.textContent = "Yeh referral link abhi blocked hai.";
      return true;
    }

    statusEl.textContent = "Redirecting...";
    detailEl.textContent = `Target URL: ${item.targetUrl}`;

    // Update Click Count
    item.clicks = (Number(item.clicks) || 0) + 1;
    await callAPI({
      action: "save",
      code: item.code,
      targetUrl: item.targetUrl,
      clicks: item.clicks,
      isBlocked: item.isBlocked,
      createdAt: item.createdAt
    });

    setTimeout(() => {
      window.location.href = item.targetUrl;
    }, 800);

    return true;
  }

  // --- DASHBOARD TABLE ---
  async function renderTable() {
    const referrals = await fetchReferrals();
    const tbody = document.getElementById('referral-table-body');
    tbody.innerHTML = '';

    if (!Array.isArray(referrals) || referrals.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--muted);">Koi links nahi hain. Upper form se banayein!</td></tr>`;
      return;
    }

    const baseUrl = window.location.href.split('#')[0];

    referrals.forEach((ref) => {
      const fullRefUrl = `${baseUrl}#ref=${ref.code}`;
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>
          <strong>${ref.code}</strong><br/>
          <button style="padding:2px 6px; font-size:11px; margin-top:4px;" class="btn-secondary" onclick="copyToClipboard('${fullRefUrl}')">Copy Link</button>
        </td>
        <td><a href="${ref.targetUrl}" target="_blank" style="color: var(--primary);">${ref.targetUrl}</a></td>
        <td><strong>${ref.clicks || 0}</strong></td>
        <td>
          <span class="badge ${ref.isBlocked ? 'badge-blocked' : 'badge-active'}">
            ${ref.isBlocked ? 'Blocked' : 'Active'}
          </span>
        </td>
        <td>
          <div class="btn-group">
            <button class="${ref.isBlocked ? 'btn-success' : 'btn-danger'}" onclick="toggleBlock('${ref.code}')">
              ${ref.isBlocked ? 'Allow' : 'Block'}
            </button>
            <button class="btn-secondary" onclick="deleteRef('${ref.code}')">Delete</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- FORM HANDLERS ---
  document.getElementById('referral-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const targetUrl = document.getElementById('target-url').value.trim();
    let code = document.getElementById('custom-code').value.trim();

    if (!code) code = Math.random().toString(36).substring(2, 8);

    await callAPI({
      action: "save",
      code: code,
      targetUrl: targetUrl,
      clicks: 0,
      isBlocked: false,
      createdAt: new Date().toISOString()
    });

    document.getElementById('referral-form').reset();
    renderTable();
  });

  window.toggleBlock = async function(code) {
    const items = await fetchReferrals();
    const ref = items.find(i => i.code === code);
    if (ref) {
      ref.isBlocked = !ref.isBlocked;
      await callAPI({
        action: "save",
        code: ref.code,
        targetUrl: ref.targetUrl,
        clicks: ref.clicks,
        isBlocked: ref.isBlocked,
        createdAt: ref.createdAt
      });
      renderTable();
    }
  };

  window.deleteRef = async function(code) {
    if (confirm(`Delete "${code}"?`)) {
      await callAPI({ action: "delete", code: code });
      renderTable();
    }
  };

  window.copyToClipboard = function(text) {
    navigator.clipboard.writeText(text).then(() => alert('Link copied!'));
  };

  document.getElementById('refresh-btn').addEventListener('click', renderTable);

  // --- EXPORT / IMPORT ---
  document.getElementById('export-btn').addEventListener('click', async () => {
    const data = await fetchReferrals();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `referrals_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('import-trigger-btn').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });

  document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async (event) => {
      try {
        const items = JSON.parse(event.target.result);
        if (Array.isArray(items)) {
          for (const item of items) {
            if (item.code && item.targetUrl) {
              await callAPI({
                action: "save",
                code: item.code,
                targetUrl: item.targetUrl,
                clicks: item.clicks || 0,
                isBlocked: item.isBlocked || false,
                createdAt: item.createdAt || new Date().toISOString()
              });
            }
          }
          alert('Import completed!');
          renderTable();
        }
      } catch (err) {
        alert('JSON File Error: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // INIT
  window.addEventListener('DOMContentLoaded', async () => {
    const isRedirecting = await handleHashAccess();
    if (!isRedirecting) {
      checkSession();
    }
  });

  window.addEventListener('hashchange', () => {
    handleHashAccess();
  });
</script>

</body>
</html>
